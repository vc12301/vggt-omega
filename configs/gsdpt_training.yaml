# GSDPT Head Training — default config (DL3DV, core losses)
# ==========================================================
# Trains only the VGGT-Omega gs_head; the aggregator, camera head, depth head,
# and GaussianAdapter stay frozen. VGGT-Omega is pose-free, so GT cameras are
# used only for view sampling — the model's own predicted cameras/depth drive
# Gaussian unprojection and novel-view rendering.
#
# Usage:
#   python train_gs.py --config configs/gsdpt_training.yaml
#   torchrun --nproc_per_node=8 train_gs.py --config configs/gsdpt_training.yaml

seed: 42
dataset_mode: "dl3dv"

# --- Model ---
model:
  checkpoint_path: "ckpts/VGGT-Omega/vggt_omega_1b_512.pt"
  gs_sh_degree: 0
  resume_gsdpt_checkpoint: null
  resume_full_checkpoint: null
  freeze_backbone: true
  init_mode: "finetune"            # finetune | reset_output | scratch

# --- Data (DL3DV) ---
data:
  data_root: "/data-nas/data/dataset/open_source/DL3DV-10K/960p"
  train_buckets: ["1K", "2K", "3K", "4K", "5K", "6K", "7K", "8K", "9K", "10K", "11K"]
  val_root: "/data-nas/data/dataset/open_source/DL3DV-10K/benchmark_140"
  val_scene_subdir: "nerfstudio"
  max_train_scenes: null
  max_val_scenes: null
  num_workers: 4
  pin_memory: true
  image_dir_name: "images_4"

# --- View Sampling (resolutions are multiples of patch_size=16) ---
view_sampling:
  resolution_schedules:
    - resolution: [272, 480]
      context_views: 32
      target_views: 24
      weight: 0.5
    - resolution: [384, 672]
      context_views: 16
      target_views: 12
      weight: 0.25
    - resolution: [544, 960]
      context_views: 8
      target_views: 6
      weight: 0.25
  fps_rotation_weight: 1.0
  min_scene_frames: 20

# --- Curriculum Learning ---
curriculum:
  enabled: true
  min_context_gap_start: 50
  min_context_gap_end: 50
  max_context_gap_start: 50
  max_context_gap_end: 200
  warmup_steps: 10000

# --- Training ---
training:
  max_iterations: 100000
  batch_size: 1
  gradient_accumulation_steps: 1
  mixed_precision: "bf16"          # bf16 | fp16 | fp32
  gradient_clip_val: 1.0
  torch_compile: false

# --- Optimizer ---
optimizer:
  name: "adamw"
  lr: 2.0e-4
  weight_decay: 0.05
  betas: [0.9, 0.95]
  eps: 1.0e-8

# --- Scheduler ---
scheduler:
  name: "cosine_annealing"
  warmup_steps: 2000
  min_lr: 1.0e-6

# --- Loss ---
loss:
  photometric_loss: "l1"           # "mse" | "l1"
  lambda_lpips: 0.05
  lpips_net: "vgg"
  lambda_depth: 0.2
  # Regularizers (0 = off)
  lambda_ssim: 0.0
  lambda_sobel: 0.0
  lambda_offset_xy: 0.0
  offset_xy_norm: "l1"
  lambda_opacity_entropy: 0.0
  lambda_scale: 0.0
  scale_norm: "l2"
  # Context-view supervision
  supervise_context: false
  lambda_context: 0.0
  context_only: false
  # Per-view self-reconstruction
  lambda_self_recon: 0.0
  # Target-view rendered-depth regularization (vs frozen depth)
  lambda_render_depth_l1: 0.0
  lambda_render_depth_grad_l1: 0.0
  # Target-view valid-visible-pixel mask
  enable_target_loss_mask: true
  target_loss_mask_depth_atol: 0.0
  target_loss_mask_depth_rtol: 0.1

# --- Validation & Checkpointing ---
validation:
  val_interval: 500
  num_preview_scenes: 4

checkpoint:
  save_top_k: 80
  save_last_k: 5
  save_dir: "checkpoints/gsdpt"

# --- WandB ---
wandb:
  project: "vggt-omega-gsdpt-training"
  name: null
  log_every_n_steps: 20
  offline: false

# --- Distributed ---
distributed:
  backend: "nccl"
